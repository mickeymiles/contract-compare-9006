<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本体拓扑 · 业务域 v4</title>
<style>
  :root{
    --top-bg:#eaf1ff; --top-bd:#2563eb; --top-tx:#1e40af;
    --child-bg:#e6f7f4; --child-bd:#0d9488; --child-tx:#0f766e;
    --ext-bg:#f1f5f9; --ext-bd:#94a3b8; --ext-tx:#475569;
    --line:#94a3b8; --sel:#f59e0b;
    --ink:#1f2937; --muted:#64748b; --bg:#f8fafc; --panel:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);}
  #app{display:flex;flex-direction:column;height:100vh;}
  header{padding:11px 20px;background:#0f172a;color:#fff;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  header h1{font-size:17px;margin:0;font-weight:600;}
  header .sub{font-size:12px;color:#94a3b8;}
  header .spacer{margin-left:auto;display:flex;align-items:center;gap:10px;}
  header .badge{font-size:11px;background:#1e293b;padding:3px 9px;border-radius:10px;color:#cbd5e1;}
  header a{font-size:12px;color:#93c5fd;text-decoration:none;}
  header a:hover{text-decoration:underline;}
  .toolbar{display:flex;align-items:center;gap:16px;padding:8px 20px;background:var(--panel);border-bottom:1px solid #e5e7eb;flex-wrap:wrap;}
  .toolbar .search{display:flex;align-items:center;gap:6px;}
  .toolbar input{padding:5px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;width:230px;outline:none;}
  .toolbar input:focus{border-color:var(--top-bd);}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap;}
  .legend .chip{display:inline-flex;align-items:center;gap:5px;}
  .legend .sw{width:13px;height:13px;border-radius:3px;border:1.5px solid;}
  .btn{padding:5px 11px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;font-size:12px;cursor:pointer;}
  .btn:hover{background:#f1f5f9;}
  .main{flex:1;display:flex;min-height:0;}
  .graph-wrap{flex:1;position:relative;overflow:hidden;background:
     radial-gradient(circle,#e2e8f0 1px,transparent 1px) 0 0/22px 22px,var(--bg);}
  #edges{position:absolute;inset:0;width:100%;height:100%;}
  .node{position:absolute;transform:translate(-50%,-50%);min-width:118px;max-width:158px;
        border-radius:9px;padding:7px 10px;cursor:pointer;user-select:none;text-align:center;
        box-shadow:0 2px 6px rgba(15,23,42,.10);transition:box-shadow .15s;
        border:1.5px solid;background:#fff;}
  .node .kind{font-size:10px;font-weight:600;letter-spacing:.3px;}
  .node .nm{font-size:15px;font-weight:700;margin-top:1px;}
  .node .ent{font-size:10px;color:var(--muted);}
  .node .cnt{font-size:10px;color:#64748b;margin-top:2px;}
  .node.top{border-color:var(--top-bd);background:var(--top-bg);}
  .node.top .kind,.node.top .nm{color:var(--top-tx);}
  .node.child{border-color:var(--child-bd);background:var(--child-bg);}
  .node.child .kind,.node.child .nm{color:var(--child-tx);}
  .node.external{border-color:var(--ext-bd);border-style:dashed;background:var(--ext-bg);}
  .node.external .kind,.node.external .nm{color:var(--ext-tx);}
  .node.sel{box-shadow:0 0 0 3px var(--sel);border-color:var(--sel)!important;}
  .node.dim{opacity:.22;}
  .edge.dim{opacity:.10;}
  aside#detail{width:400px;flex:none;background:var(--panel);border-left:1px solid #e5e7eb;overflow-y:auto;padding:16px 18px;}
  aside h2{font-size:15px;margin:0 0 4px;}
  aside .tag{display:inline-block;font-size:10px;font-weight:600;padding:1px 7px;border-radius:9px;margin-right:5px;}
  aside .desc{font-size:12px;color:var(--muted);line-height:1.55;margin:8px 0 12px;}
  .sec-t{font-size:12px;font-weight:700;color:#334155;margin:15px 0 6px;display:flex;align-items:center;gap:7px;}
  .sec-t .ln{flex:1;height:1px;background:#e5e7eb;}
  table.fields{width:100%;border-collapse:collapse;font-size:12px;}
  table.fields th,table.fields td{border:1px solid #e5e7eb;padding:4px 7px;text-align:left;vertical-align:top;}
  table.fields th{background:#f1f5f9;color:#475569;font-weight:600;width:36%;}
  table.fields td .ty{font-size:10px;color:#0891b2;font-family:monospace;}
  table.fields td .src{font-size:10px;color:#94a3b8;font-family:monospace;display:block;margin-top:1px;}
  .req{color:#dc2626;font-weight:700;}
  .rel-list{font-size:12px;line-height:1.7;}
  .rel-list .r{display:flex;gap:6px;}
  .rel-list .arrow{color:var(--top-bd);}
  .fn-list{font-size:12px;line-height:1.65;}
  .fn-list b{color:#0f766e;}
  .note{font-size:12px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:7px;padding:9px 11px;margin-top:12px;line-height:1.55;}
  .grp{font-size:11px;font-weight:700;color:#475569;background:#f8fafc;border:1px solid #e5e7eb;border-radius:6px;padding:4px 8px;margin:10px 0 6px;display:flex;justify-content:space-between;}
  .grp .n{color:#94a3b8;font-weight:600;}
  .cols-wrap{max-height:none;}
  .col-chip{display:inline-block;font-size:11px;padding:1px 6px;margin:2px 3px 2px 0;background:#f8fafc;border:1px solid #e5e7eb;border-radius:4px;color:#475569;}
  .col-chip.bound{background:#ecfdf5;border-color:#6ee7b7;color:#065f46;font-weight:600;}
  footer{font-size:11px;color:var(--muted);padding:6px 20px;background:var(--panel);border-top:1px solid #e5e7eb;line-height:1.6;}
  footer b{color:#334155;}
  .ov-empty{color:var(--muted);font-size:13px;line-height:1.75;}
  .stat{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px;}
  .stat .s{flex:1;min-width:74px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:7px;padding:7px 9px;text-align:center;}
  .stat .s .v{font-size:19px;font-weight:700;color:#0f766e;}
  .stat .s .l{font-size:10px;color:#64748b;margin-top:1px;}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           font-size:14px;color:#64748b;background:rgba(248,250,252,.92);z-index:5;}
  .err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px;
       font-size:13px;color:#b91c1c;background:#fff;z-index:6;text-align:center;line-height:1.7;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>本体拓扑 · 业务域 v4</h1>
    <span class="sub">实体—关系图形化视图（参考阿里 UModel 展示形式）</span>
    <span class="spacer">
      <span class="badge" id="rev">加载中…</span>
      <a href="/core">← 返回主数据</a>
    </span>
  </header>
  <div class="toolbar">
    <div class="search">
      <span style="font-size:13px;color:#475569;">搜索</span>
      <input id="q" placeholder="实体名 / 谓词 / 属性，如 合同 / 回款 / 产值">
    </div>
    <div class="legend">
      <span class="chip"><span class="sw" style="background:var(--top-bg);border-color:var(--top-bd);"></span>顶层实体</span>
      <span class="chip"><span class="sw" style="background:var(--child-bg);border-color:var(--child-bd);"></span>子实体</span>
      <span class="chip"><span class="sw" style="background:var(--ext-bg);border-color:var(--ext-bd);border-style:dashed;"></span>范围外占位</span>
      <span class="chip"><span class="sw" style="background:#fff;border-color:var(--line);"></span>关系边（谓词·基数）</span>
    </div>
    <button class="btn" id="reset">重置布局</button>
    <button class="btn" id="reload">重新加载</button>
  </div>
  <div class="main">
    <div class="graph-wrap" id="wrap">
      <svg id="edges"></svg>
      <div id="loading">正在从 ontos 加载本体定义…</div>
    </div>
    <aside id="detail"></aside>
  </div>
  <footer>
    <b>数据来源：</b>TBox 定义实时取自 <code>ontos.domain_business.to_spec()</code>（submodule，每次请求重新执行，改代码刷新即生效）；
    物理字段取自 <code>datasource/datasource_meta.json</code>（总合同表 / 项目里程碑表最新版本）。
    <b>范围：</b>回款周期 / 资金占用 / 毛利率 / 成本预警 / ROI 五个场景。
  </footer>
</div>
<script src="/ontos-topology.app.js"></script>
</body>
</html>
