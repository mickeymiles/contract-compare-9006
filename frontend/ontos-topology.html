<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本体浏览器 · UModel Explorer</title>
<link rel="stylesheet" href="/common.css">
<style>
  /* 本页变量与 common.css 同步（深色科技风 · 蓝青渐变 + 霓虹） */
  :root{
    --top-bg:rgba(79,140,255,.14); --top-bd:#4f8cff; --top-tx:#22d3ee;
    --child-bg:rgba(167,139,250,.14); --child-bd:#a78bfa; --child-tx:#a78bfa;
    --ext-bg:rgba(125,141,176,.08); --ext-bd:#7d8db0; --ext-tx:#7d8db0;
    --sel:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:'Microsoft YaHei','PingFang SC','Helvetica Neue',sans-serif;font-size:12px}
  #app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* ===== 顶部栏 ===== */
  .utop{padding:11px 22px;background:linear-gradient(180deg,#101b31,#0d1526);
    border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;
    box-shadow:0 2px 18px rgba(0,0,0,.4)}
  .utop h1{font-size:17px;color:var(--cyan);margin:0;font-weight:600;
    text-shadow:0 0 14px rgba(79,140,255,.45)}
  .utop .sub{font-size:12px;color:var(--text2)}
  .utop .spacer{margin-left:auto;display:flex;align-items:center;gap:10px}
  .utop .rev{font-size:11px;background:var(--bg3);padding:4px 10px;border-radius:10px;
    color:var(--cyan2);border:1px solid var(--border);font-family:var(--mono)}
  .utop a{font-size:12px;color:var(--cyan2);text-decoration:none}
  .utop a:hover{text-decoration:underline}

  /* ===== 工具条 ===== */
  .utb{display:flex;align-items:center;gap:10px;padding:9px 22px;
    background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap}
  .seg{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{padding:6px 14px;background:none;border:none;color:var(--text2);font-size:12px;
    cursor:pointer;transition:all .2s}
  .seg button.active{background:linear-gradient(135deg,var(--cyan),var(--cyan2));
    color:#04121f;font-weight:600}
  .seg.hide{display:none}
  .utb input{padding:6px 12px;background:var(--bg3);border:1px solid var(--border);
    color:var(--text);border-radius:8px;font-size:12px;width:230px;outline:none;font-family:inherit}
  .utb input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
  .utb .spacer{margin-left:auto;display:flex;gap:8px;align-items:center}
  .utb .count{font-size:11px;color:var(--text2);font-family:var(--mono);margin-right:6px}
  .utb .count b{color:var(--cyan2)}

  /* ===== 三栏 ===== */
  .umain{flex:1;display:flex;min-height:0}
  .uside{width:280px;flex:none;background:var(--bg2);border-right:1px solid var(--border);
    overflow-y:auto;padding:14px 12px}
  .upane{width:400px;flex:none;background:var(--bg);border-right:1px solid var(--border);
    overflow-y:auto;padding:14px 16px}
  .ucanvas{flex:1;min-width:0;position:relative;background:
    radial-gradient(circle at 25% 15%,rgba(79,140,255,.08),transparent 55%),
    radial-gradient(circle at 80% 75%,rgba(34,211,238,.05),transparent 55%),var(--bg)}

  /* ===== 侧栏：手风琴（实体/函数/动作/拓扑 互斥） ===== */
  .sgrp{margin-bottom:8px;border-radius:10px;border:1px solid transparent;transition:all .2s}
  .sgrp.acc{background:var(--bg2);border-color:var(--border);overflow:hidden}
  .sgrp.acc.open{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(79,140,255,.18),0 6px 18px rgba(0,0,0,.3)}
  .acc-h{display:flex;justify-content:space-between;align-items:center;
    font-size:11px;color:var(--text);margin:0;padding:10px 12px;letter-spacing:.5px;
    text-transform:uppercase;font-weight:600;cursor:pointer;user-select:none;
    transition:all .15s;background:transparent}
  .acc-h:hover{background:rgba(79,140,255,.08);color:var(--cyan2)}
  .acc-h .ttl{display:flex;align-items:center;gap:7px}
  .acc-h .grp-i{width:7px;height:7px;border-radius:50%;flex:none}
  .acc-h .grp-i.entity{background:linear-gradient(135deg,var(--cyan),var(--cyan2));box-shadow:0 0 6px rgba(79,140,255,.4)}
  .acc-h .grp-i.function{background:linear-gradient(135deg,var(--green),#22d3ee);box-shadow:0 0 6px rgba(52,211,153,.4)}
  .acc-h .grp-i.action{background:linear-gradient(135deg,var(--orange),#f87171);box-shadow:0 0 6px rgba(251,191,36,.4)}
  .acc-h .grp-i.topo{background:linear-gradient(135deg,#a78bfa,#f472b6);box-shadow:0 0 6px rgba(167,139,250,.4)}
  .acc-h .tg{font-size:9px;color:var(--text2);transition:transform .2s;margin-left:8px;font-family:var(--mono)}
  .acc-h.open .tg{transform:rotate(90deg);color:var(--cyan2)}
  .acc-h .n{color:var(--cyan);font-family:var(--mono);font-weight:bold;font-size:11px;
    background:var(--bg3);padding:2px 7px;border-radius:6px;border:1px solid var(--border)}
  .acc-b{padding:8px 8px 10px;border-top:1px solid var(--border);animation:fadeIn .2s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

  /* 侧栏：分类条目（带数量） */
  .cat{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;
    margin:3px 0;cursor:pointer;color:var(--text2);font-size:12px;transition:all .15s;
    border-left:2px solid transparent}
  .cat:hover{background:rgba(79,140,255,.08);color:var(--text);transform:translateX(2px)}
  .cat.active{background:linear-gradient(90deg,rgba(79,140,255,.18),transparent);
    color:var(--cyan2);font-weight:600;border-left-color:var(--cyan2)}
  .cat .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .cat .dot.entity{background:linear-gradient(135deg,var(--cyan),var(--cyan2))}
  .cat .dot.function{background:linear-gradient(135deg,var(--green),#22d3ee)}
  .cat .dot.action{background:linear-gradient(135deg,var(--orange),#f87171)}
  .cat .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cat .ct{font-family:var(--mono);font-size:10px;background:var(--bg3);padding:1px 6px;
    border-radius:5px;color:var(--text2)}

  /* 拓扑组体 */
  .topo-entry{padding:14px 12px;text-align:center;color:var(--text2);font-size:12px;line-height:1.7}
  .topo-entry .big{font-size:13px;color:var(--cyan2);font-weight:600;margin-bottom:6px}
  .topo-entry .go{display:inline-block;margin-top:8px;padding:7px 18px;border-radius:8px;
    background:rgba(251,191,36,.16);border:1px solid rgba(251,191,36,.45);color:#fbbf24;
    cursor:pointer;font-family:inherit;font-size:12px;transition:all .15s}
  .topo-entry .go:hover{background:rgba(251,191,36,.28);transform:translateY(-1px)}

  /* ===== 中间面板：列表 ===== */
  .list-h{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;
    margin:2px 4px 10px;font-weight:600;display:flex;align-items:center;gap:8px}
  .list-h .ct{font-family:var(--mono);color:var(--cyan);background:var(--bg3);
    padding:1px 8px;border-radius:6px;border:1px solid var(--border)}
  .list-item{background:linear-gradient(160deg,var(--panel),var(--panel2));
    border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:9px;
    cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
  .list-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan);opacity:.6}
  .list-item.fn::before{background:var(--green)}
  .list-item.act::before{background:var(--orange)}
  .list-item.ent::before{background:var(--cyan)}
  .list-item:hover{border-color:var(--cyan);transform:translateX(2px)}
  .list-item.active{border-color:var(--cyan);background:linear-gradient(90deg,rgba(79,140,255,.16),transparent)}
  .list-item .nm{font-size:13px;font-weight:600;color:var(--text)}
  .list-item.fn .nm{color:var(--green)}
  .list-item.act .nm{color:var(--orange)}
  .list-item .id{font-family:var(--mono);font-size:10px;color:var(--text2);margin-left:6px}
  .list-item .ds{font-size:11px;color:var(--text2);margin-top:4px;line-height:1.5;
    max-height:32px;overflow:hidden}
  .list-item .meta{font-size:10px;color:var(--cyan2);font-family:var(--mono);margin-top:5px}
  .list-empty{color:var(--text2);font-size:12px;text-align:center;padding:30px 10px;
    background:var(--bg3);border-radius:8px;border:1px dashed var(--border)}

  /* ===== 右侧：可编辑详情 ===== */
  .detail-edit{position:absolute;inset:0;overflow-y:auto;padding:18px 22px;display:none;z-index:3}
  .detail-edit.show{display:block}
  .ed-head{padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:16px}
  .ed-head .tags{margin-bottom:8px}
  .ed-head h2{font-size:18px;color:var(--text);margin:0 0 4px}
  .ed-head .en{font-family:var(--mono);font-size:11px;color:var(--text2)}
  .pn-tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 9px;border-radius:10px;
    margin-right:6px;letter-spacing:.3px}
  .pn-tag.entity{background:var(--top-bg);color:var(--top-tx);border:1px solid var(--top-bd)}
  .pn-tag.function{background:rgba(52,211,153,.14);color:var(--green);border:1px solid rgba(52,211,153,.3)}
  .pn-tag.action{background:rgba(251,191,36,.14);color:var(--orange);border:1px solid rgba(251,191,36,.3)}
  .pn-tag.cat{background:rgba(125,141,176,.12);color:var(--text2);border:1px solid var(--border)}

  .ed-sec{margin:14px 0}
  .ed-sec>label{display:block;font-size:10px;color:var(--text2);text-transform:uppercase;
    letter-spacing:.5px;margin-bottom:6px;font-weight:600}
  .ed-input,.ed-textarea,.ed-select{width:100%;background:var(--bg3);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:8px 10px;font-size:12px;font-family:inherit;outline:none}
  .ed-input:focus,.ed-textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
  .ed-textarea{resize:vertical;min-height:70px;font-family:var(--mono);line-height:1.5}
  .ed-hint{font-size:10px;color:var(--text2);margin-top:4px}
  .ed-chips{display:flex;flex-wrap:wrap;gap:6px}
  .ed-chip{padding:4px 10px;border-radius:8px;font-size:11px;font-family:var(--mono);cursor:pointer;
    background:var(--bg3);border:1px solid var(--border);color:var(--text2);transition:all .15s;user-select:none}
  .ed-chip:hover{border-color:var(--cyan)}
  .ed-chip.on{background:rgba(79,140,255,.18);border-color:var(--cyan);color:var(--cyan2)}
  .ed-check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);cursor:pointer}
  .ed-actions{display:flex;gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid var(--border);align-items:center}
  .btn-save{background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#04121f;font-weight:600;
    border:none;padding:9px 22px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px;transition:all .15s}
  .btn-save:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(79,140,255,.3)}
  .btn-save:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
  .btn-reset{background:var(--bg3);border:1px solid var(--border);color:var(--text2);
    padding:9px 18px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px}
  .ed-status{font-size:11px;margin-left:auto}
  .ed-status.ok{color:var(--green)} .ed-status.err{color:var(--red)}
  .ed-readonly{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-top:14px}
  .ed-readonly h4{font-size:10px;color:var(--cyan2);margin:0 0 8px;text-transform:uppercase;letter-spacing:.4px}
  .ed-readonly .rel-list .r{display:flex;gap:8px;padding:6px 8px;border-radius:6px;margin-bottom:4px;
    background:var(--bg3);border:1px solid var(--border);align-items:center}
  .ed-readonly .rel-list .arrow{color:var(--cyan);font-weight:bold;font-family:var(--mono);font-size:13px}
  .ed-readonly .rel-list .p{color:var(--cyan2);font-family:var(--mono);font-size:11px;font-weight:600;
    background:rgba(79,140,255,.12);padding:2px 6px;border-radius:4px;border:1px solid rgba(79,140,255,.3)}
  .ed-readonly .rel-list .lab{color:var(--text);flex:1;font-size:12px}
  .ed-readonly .fn-item,.ed-readonly .act-item{padding:7px 10px;border-radius:8px;margin-bottom:6px;
    background:var(--panel);border:1px solid var(--border)}
  .ed-readonly .fn-item{border-left:3px solid var(--cyan)}
  .ed-readonly .act-item{border-left:3px solid var(--purple)}
  .ed-readonly .fn-item .nm{color:var(--cyan2);font-size:12px;font-weight:600}
  .ed-readonly .act-item .nm{color:var(--purple);font-size:12px;font-weight:600}
  .ed-readonly .fn-item .desc,.ed-readonly .act-item .desc{color:var(--text2);font-size:11px;margin-top:3px;line-height:1.5}

  /* ===== 画布工具 ===== */
  .g-tools{position:absolute;bottom:18px;left:18px;display:none;flex-direction:column;
    gap:3px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;
    padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:10;backdrop-filter:blur(6px)}
  .g-tools button{width:30px;height:30px;background:transparent;border:none;
    color:var(--text);cursor:pointer;font-size:14px;border-radius:5px;
    transition:all .15s;font-family:inherit}
  .g-tools button:hover{background:rgba(79,140,255,.18);color:var(--cyan2)}
  .g-tools button:active{transform:scale(.92)}

  .g6-minimap-container,.g-minimap{position:absolute!important;bottom:18px!important;
    right:18px!important;top:auto!important;left:auto!important;
    background:var(--bg2)!important;border:1px solid var(--border)!important;
    border-radius:8px!important;padding:6px!important;
    box-shadow:0 4px 14px rgba(0,0,0,.4)!important;opacity:.9!important;z-index:10!important}

  #g6{position:absolute;inset:0;display:none}
  #g6-table{display:none;position:absolute;inset:14px;overflow:auto;border-radius:8px;
    background:var(--bg2);border:1px solid var(--border);padding:6px}
  #g6-table table{font-size:11px}
  #g6-table th{position:sticky;top:0;background:var(--bg3);z-index:1}

  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--text2);background:rgba(11,18,32,.85);z-index:5}
  .err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:40px;
    font-size:13px;color:var(--red);background:rgba(11,18,32,.92);z-index:6;text-align:center;
    line-height:1.7}

  /* ===== 一级标签：TBox / ABox / 拓扑 ===== */
  .utabs{display:flex;gap:2px;padding:0 22px;background:var(--bg2);border-bottom:1px solid var(--border)}
  .utab{padding:11px 20px;background:none;border:none;border-bottom:2px solid transparent;
    color:var(--text2);font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit}
  .utab:hover{color:var(--text)}
  .utab.active{color:var(--cyan2);border-bottom-color:var(--cyan);font-weight:600;
    text-shadow:0 0 10px rgba(79,140,255,.3)}

  /* ===== ABox 面板 ===== */
  .abox-panel{flex:1;min-height:0;overflow-y:auto;padding:18px 22px;display:none;background:
    radial-gradient(circle at 20% 10%,rgba(79,140,255,.06),transparent 55%),var(--bg)}
  .abox-panel.show{display:block}
  .abox-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .abox-head h2{font-size:15px;color:var(--cyan2);margin:0;font-weight:600}
  .abox-badge{font-size:11px;padding:3px 10px;border-radius:10px;font-family:var(--mono);
    background:var(--bg3);border:1px solid var(--border);color:var(--text2)}
  .abox-badge.ok{color:var(--green);border-color:rgba(52,211,153,.4)}
  .abox-badge.bad{color:var(--red);border-color:rgba(248,113,113,.4)}
  .abox-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px}
  .abox-card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--border);
    border-radius:12px;padding:14px 16px}
  .abox-card.full{grid-column:1/-1}
  .abox-card h3{font-size:12px;color:var(--cyan);margin:0 0 10px;text-transform:uppercase;
    letter-spacing:.5px;font-weight:600}
  .abox-kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--border);font-size:12px}
  .abox-kv:last-child{border-bottom:none}
  .abox-kv .k{color:var(--text2)} .abox-kv .v{color:var(--text);font-family:var(--mono)}
  .abox-tbl{width:100%;border-collapse:collapse;font-size:11px}
  .abox-tbl th{text-align:left;color:var(--text2);padding:5px 8px;border-bottom:1px solid var(--border);
    position:sticky;top:0;background:var(--panel2)}
  .abox-tbl td{padding:5px 8px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:top}
  .abox-tbl td.mono{font-family:var(--mono);color:var(--cyan2)}
  .abox-na{color:var(--red)} .abox-ok{color:var(--green)}
  .abox-fnbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .abox-fnbar select{padding:8px 12px;background:var(--bg3);border:1px solid var(--border);color:var(--text);
    border-radius:8px;font-size:12px;font-family:inherit;min-width:300px;outline:none}
  .abox-fnbar select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
  .abox-fnbar .hint{font-size:11px;color:var(--text2)}
  .abox-status-pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:600;font-family:var(--mono)}
  .abox-status-pill.超支{background:rgba(248,113,113,.16);color:var(--red);border:1px solid rgba(248,113,113,.4)}
  .abox-status-pill.预警{background:rgba(251,191,36,.16);color:var(--orange);border:1px solid rgba(251,191,36,.4)}
  .abox-status-pill.正常{background:rgba(52,211,153,.16);color:var(--green);border:1px solid rgba(52,211,153,.4)}
  .abox-na-reason{background:var(--bg3);border:1px dashed var(--border);border-radius:10px;padding:14px 16px;
    color:var(--text2);font-size:12px;line-height:1.7}
  .abox-dist{display:flex;gap:10px;margin:10px 0 14px;flex-wrap:wrap}
  .abox-dist .d{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 14px;text-align:center}
  .abox-dist .d .n{font-size:18px;font-weight:700;font-family:var(--mono)}
  .abox-dist .d .l{font-size:10px;color:var(--text2)}
  .abox-summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .abox-summary .s{font-size:11px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:4px 10px}
  .abox-summary .s b{color:var(--cyan2);font-family:var(--mono)}
  .abox-empty{color:var(--text2);font-size:12px;text-align:center;padding:24px}

  /* 提示气泡（保存成功等） */
  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-12px);
    background:var(--bg2);border:1px solid var(--cyan);color:var(--cyan2);padding:10px 20px;
    border-radius:10px;font-size:13px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.5);
    opacity:0;transition:opacity .25s, transform .25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:var(--red);color:var(--red)}

  /* ===== 拓扑：节点上下游关系面板 ===== */
  .rel-row{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;margin-bottom:5px;
    background:var(--bg3);border:1px solid var(--border);cursor:pointer;transition:all .15s}
  .rel-row:hover{border-color:var(--orange);transform:translateX(2px)}
  .rel-row .p{color:var(--orange);font-family:var(--mono);font-size:11px;font-weight:600;
    background:rgba(251,191,36,.12);padding:2px 6px;border-radius:4px;border:1px solid rgba(251,191,36,.3)}
  .rel-row .lab{color:var(--text);flex:1;font-size:12px}
  .rel-row .id{color:var(--text2);font-family:var(--mono);font-size:10px}
  .rel-jump{margin-top:14px;display:inline-block;padding:7px 16px;border-radius:8px;
    background:rgba(251,191,36,.16);border:1px solid rgba(251,191,36,.4);color:var(--orange);
    cursor:pointer;font-family:inherit;font-size:12px;transition:all .15s}
  .rel-jump:hover{background:rgba(251,191,36,.28);transform:translateY(-1px)}
</style>
</head>
<body>
<div id="app">
  <header class="utop">
    <h1>本体浏览器 · UModel Explorer</h1>
    <span class="sub">实体 / 函数 / 动作 定义浏览与编辑 · 拓扑独立视图</span>
    <span class="spacer">
      <span class="rev" id="rev">加载中…</span>
      <a href="/core">← 返回主数据</a>
    </span>
  </header>
  <nav class="utabs">
    <button class="utab active" data-tab="tbox">TBox 定义</button>
    <button class="utab" data-tab="abox">ABox 实例</button>
    <button class="utab" data-tab="topo">拓扑关系</button>
  </nav>
  <div class="utb">
    <div class="seg hide" id="view-seg">
      <button class="active" data-view="graph">Graph</button>
      <button data-view="table">Table</button>
    </div>
    <input id="q" placeholder="🔍 搜索 实体 / 函数 / 动作（按当前分组）…">
    <div class="spacer">
      <span class="count"><b id="cnt-n">0</b> 节点 / <b id="cnt-l">0</b> 链接</span>
      <button class="btn btn-o btn-s" id="reset">↺ 重置布局</button>
      <button class="btn btn-o btn-s" id="reload">⟳ 重新加载</button>
    </div>
  </div>
  <div class="umain">
    <aside class="uside" id="side"></aside>
    <section class="upane" id="detail"></section>
    <div class="ucanvas">
      <div id="loading">正在从 ontos 加载本体定义…</div>
      <div id="g6"></div>
      <div id="g6-table">
        <table><thead><tr>
          <th>谓词</th><th>源 → 目标</th><th>基数</th><th>说明</th>
        </tr></thead><tbody id="tbl-body"></tbody></table>
      </div>
      <div class="detail-edit" id="detail-edit"></div>
      <div class="g-tools" id="g-tools">
        <button title="放大" data-act="zoom-in">+</button>
        <button title="缩小" data-act="zoom-out">−</button>
        <button title="适应" data-act="fit">⤢</button>
        <button title="重置" data-act="reset">↺</button>
      </div>
    </div>
  </div>
  <div class="abox-panel" id="abox-panel"></div>
</div>
<div class="toast" id="toast"></div>
<script src="https://gw.alipayobjects.com/os/lib/antv/g6/4.8.24/dist/g6.min.js"></script>
<script src="/ontos-topology.app.js"></script>
</body>
</html>
