<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四算基线 · 财经 · 经营业务工作台</title>
<link rel="stylesheet" href="/common.css">
<!-- echarts（总览状态分布图） -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
<div id="app" class="app-frame">
  <!-- 两级导航 · 顶部：左面包屑 + 右主菜单(域) -->
  <div class="app-topbar">
    <nav class="breadcrumb" id="breadcrumb"></nav>
    <nav class="topmenu" id="topMenu"></nav>
  </div>

  <!-- 主体：左=财经域手风琴；右=页面 -->
  <div class="app-body">
    <aside class="nav-rail" id="navRail"></aside>

    <main class="app-main app-content">
      <!-- 独立工具条：只读投影说明 + 刷新（无任何录入按钮） -->
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px">
        <span style="font-size:11px;color:var(--text2)" id="fcStatus">四算基线 · 合同级只读投影（读 md_contract 主数据，无录入）</span>
        <div style="display:flex;align-items:center;gap:10px">
          <button class="btn btn-o" onclick="FourCalc.load()" id="btnFcReload">↻ 刷新投影</button>
        </div>
      </div>

      <!-- 结果区：顶部 Tab（总览 / 明细），由 finance-baseline.app.js 渲染 -->
      <div id="fcContent">
        <div class="ana-empty"><div class="icon">⚠️</div><div>正在读取四算投影...</div></div>
      </div>
    </main>
  </div>
</div>

<script src="/nav.config.js"></script>
<script src="/finance-baseline.app.js"></script>
</body>
</html>
