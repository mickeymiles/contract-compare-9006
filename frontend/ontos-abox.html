<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABox 实例 · 本体数据可观测</title>
<link rel="stylesheet" href="/common.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Microsoft YaHei','PingFang SC','Helvetica Neue',sans-serif;font-size:12px}
  a{color:var(--cyan2);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 22px 60px}
  .top{padding:14px 22px;background:linear-gradient(180deg,#101b31,#0d1526);
    border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;
    box-shadow:0 2px 18px rgba(0,0,0,.4);position:sticky;top:0;z-index:5}
  .top h1{font-size:17px;color:var(--cyan);margin:0;font-weight:600;
    text-shadow:0 0 14px rgba(79,140,255,.45)}
  .top .sub{font-size:12px;color:var(--text2)}
  .top .spacer{margin-left:auto;display:flex;gap:10px;align-items:center}
  .top .rev{font-size:11px;background:var(--bg3);padding:4px 10px;border-radius:10px;
    color:var(--cyan2);border:1px solid var(--border);font-family:var(--mono)}

  .card{background:linear-gradient(160deg,var(--panel),var(--panel2));
    border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-top:18px}
  .card h2{font-size:13px;color:var(--cyan2);margin:0 0 14px;font-weight:600;
    display:flex;align-items:center;gap:8px}
  .card h2 .tag{font-size:10px;font-family:var(--mono);color:var(--text2);
    background:var(--bg3);padding:2px 8px;border-radius:6px;border:1px solid var(--border)}

  /* 状态卡 */
  .stat-grid{display:flex;flex-wrap:wrap;gap:12px}
  .stat{flex:1;min-width:150px;background:var(--bg3);border:1px solid var(--border);
    border-radius:10px;padding:13px 15px}
  .stat .k{font-size:11px;color:var(--text2);margin-bottom:6px}
  .stat .v{font-size:21px;font-weight:700;color:var(--text);font-family:var(--mono)}
  .stat .v.ok{color:var(--green)} .stat .v.warn{color:var(--orange)} .stat .v.bad{color:var(--red)}
  .stat .v small{font-size:12px;color:var(--text2);font-weight:400}

  /* 表 */
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--border)}
  th{color:var(--text2);text-transform:uppercase;font-size:10px;letter-spacing:.4px;
    position:sticky;top:0;background:var(--bg2)}
  td.mono,code{font-family:var(--mono)}
  tr:hover td{background:rgba(79,140,255,.05)}
  .badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 9px;border-radius:10px;
    font-family:var(--mono)}
  .badge.yes{background:rgba(52,211,153,.16);color:var(--green);border:1px solid rgba(52,211,153,.3)}
  .badge.no{background:rgba(251,113,133,.16);color:var(--red);border:1px solid rgba(251,113,133,.3)}
  .badge.na{background:rgba(125,141,176,.14);color:var(--text2);border:1px solid var(--border)}
  .badge.正常{background:rgba(52,211,153,.16);color:var(--green);border:1px solid rgba(52,211,153,.3)}
  .badge.预警{background:rgba(251,191,36,.16);color:var(--orange);border:1px solid rgba(251,191,36,.3)}
  .badge.超支{background:rgba(251,113,133,.16);color:var(--red);border:1px solid rgba(251,113,133,.3)}

  /* 非空率条 */
  .rate{display:flex;align-items:center;gap:8px}
  .rate .bar{flex:1;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden;min-width:60px}
  .rate .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--cyan2))}
  .rate .pct{font-family:var(--mono);font-size:10px;color:var(--text2);width:42px;text-align:right}

  .na-list{display:flex;flex-wrap:wrap;gap:10px}
  .na{background:rgba(125,141,176,.1);border:1px dashed var(--border);border-radius:10px;
    padding:10px 13px;max-width:340px}
  .na .t{color:var(--text);font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .na .d{color:var(--text2);font-size:11px;line-height:1.5}

  .summary{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
  .summary .s{flex:1;min-width:120px;background:var(--bg3);border:1px solid var(--border);
    border-radius:10px;padding:11px 14px}
  .summary .s .k{font-size:10px;color:var(--text2);margin-bottom:5px}
  .summary .s .v{font-size:15px;font-weight:700;color:var(--cyan2);font-family:var(--mono)}

  .load{color:var(--text2);padding:40px;text-align:center}
  .err{color:var(--red);padding:30px;text-align:center;line-height:1.7}
  .muted{color:var(--text2);font-size:11px;margin-top:8px;line-height:1.6}
  .hint{font-size:11px;color:var(--text2);background:var(--bg3);border:1px solid var(--border);
    border-radius:8px;padding:9px 12px;margin-top:12px;line-height:1.6}
</style>
</head>
<body>
<div class="top">
  <h1>ABox 实例 · 本体数据可观测</h1>
  <span class="sub">实体绑定 → 物理实例 · 绑定映射 · 本体判定</span>
  <span class="spacer">
    <span class="rev" id="rev">—</span>
    <a href="/ontos-topology">← 返回 TBox 拓扑</a>
  </span>
</div>
<div class="wrap" id="root">
  <div class="load">正在从本体加载 ABox 实例…</div>
</div>
<script src="/ontos-abox.app.js"></script>
</body>
</html>
